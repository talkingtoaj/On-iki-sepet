# Cloud Build trigger: push to main -> build, check lineage, migrate, deploy.
# GCP project: lifebalance-nuxt (see docs/deployment/runbook.md)
#
# This replaces the collaborator's cloudbuild.yaml, which cannot deploy this
# branch: it set DJANGO_SETTINGS_MODULE=config.production_settings and a single
# DATABASE_URL, while this lineage has no production_settings module and reads
# DJANGO_ENV plus discrete POSTGRES_* variables (see config/env.py).
#
# The trigger is deliberately left enabled, so a merge to main deploys. The
# check-lineage step below is what makes that safe: see "Database lineage" in
# docs/deployment/runbook.md for why migrate alone is not.

substitutions:
  _REGION: us-central1
  _SERVICE: kut-finans
  _INSTANCE: lb-db2
  _DB_NAME: oniki_sepet
  _DB_USER: oniki_sepet_app
  _BUCKET: kut-finans-media
  # No mail infrastructure yet. The console backend prints messages to the
  # Cloud Run log instead of sending them, which keeps password reset
  # discoverable (an admin can read the link out of the log) without pretending
  # mail works. config/env.py only refuses to start when the SMTP backend is
  # selected with no host, so naming a non-SMTP backend here is the supported
  # way to run without mail.
  #
  # To switch to real mail: set _EMAIL_BACKEND to
  # django.core.mail.backends.smtp.EmailBackend and add DJANGO_EMAIL_HOST,
  # DJANGO_EMAIL_HOST_USER and a DJANGO_EMAIL_HOST_PASSWORD secret below.
  _EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  _FROM_EMAIL: onikisepet@example.org

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/oniki-sepet-django-secret-key/versions/latest
      env: 'DJANGO_SECRET_KEY'
    - versionName: projects/$PROJECT_ID/secrets/oniki-sepet-postgres-password/versions/latest
      env: 'POSTGRES_PASSWORD'

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from=us.gcr.io/$PROJECT_ID/kut-finans:latest
      - -t
      - us.gcr.io/$PROJECT_ID/kut-finans:$COMMIT_SHA
      - -t
      - us.gcr.io/$PROJECT_ID/kut-finans:latest
      - .

  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args: ['push', 'us.gcr.io/$PROJECT_ID/kut-finans:$COMMIT_SHA']

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args: ['push', 'us.gcr.io/$PROJECT_ID/kut-finans:latest']

  # Refuse to migrate a database from the collaborator's lineage.
  #
  # Without this step the deploy is genuinely dangerous rather than merely
  # broken. Their database has 0007-0011 applied under different names, so
  # migrate does not skip our versions: it applies 0007-0010 successfully, then
  # fails at 0011 on tables that already exist. Each migration commits
  # separately on PostgreSQL, so the church's live schema would be left
  # half-migrated with nothing rolled back and a red build to read afterwards.
  #
  # This step turns that into a clean refusal before anything is written. It
  # exits non-zero, which stops the build before migrate.
  - id: check-lineage
    name: gcr.io/google-appengine/exec-wrapper
    secretEnv: ['DJANGO_SECRET_KEY', 'POSTGRES_PASSWORD']
    args:
      - -i
      - us.gcr.io/$PROJECT_ID/kut-finans:$COMMIT_SHA
      - -s
      - $PROJECT_ID:${_REGION}:${_INSTANCE}
      # Bare "-e VARNAME" (no "=value") forwards the real secretEnv value.
      # "-e VARNAME=$$VARNAME" does NOT work here: exec-wrapper is a
      # shell-less static binary, and Cloud Build's own "$$" in args is an
      # escape for a literal "$", not a secretEnv substitution — it silently
      # passes the literal string "$VARNAME" instead of the secret.
      - -e
      - DJANGO_ENV=production
      - -e
      - DJANGO_SECRET_KEY
      - -e
      - POSTGRES_PASSWORD
      - -e
      - POSTGRES_DB=${_DB_NAME}
      - -e
      - POSTGRES_USER=${_DB_USER}
      - -e
      - POSTGRES_HOST=/cloudsql/$PROJECT_ID:${_REGION}:${_INSTANCE}
      - -e
      - DJANGO_ALLOWED_HOSTS=.run.app
      # These steps do not send mail, and production refuses to start with the
      # SMTP backend and no host. Declaring the dummy backend is exactly what
      # config/env.py suggests, and beats inventing a mail host here.
      - -e
      - DJANGO_EMAIL_BACKEND=django.core.mail.backends.dummy.EmailBackend
      - --
      # uv run, not bare python: the image installs dependencies into the uv
      # virtualenv at /app/.venv, which a bare interpreter does not see. The
      # Dockerfile's own CMD runs gunicorn the same way.
      - uv
      - run
      - python
      - manage.py
      - check_database_lineage

  # Pre-deploy migration. Never run migrations at container startup on
  # Cloud Run: concurrent cold starts would race the same migration.
  - id: migrate
    name: gcr.io/google-appengine/exec-wrapper
    secretEnv: ['DJANGO_SECRET_KEY', 'POSTGRES_PASSWORD']
    args:
      - -i
      - us.gcr.io/$PROJECT_ID/kut-finans:$COMMIT_SHA
      - -s
      - $PROJECT_ID:${_REGION}:${_INSTANCE}
      - -e
      - DJANGO_ENV=production
      - -e
      - DJANGO_SECRET_KEY
      - -e
      - POSTGRES_PASSWORD
      - -e
      - POSTGRES_DB=${_DB_NAME}
      - -e
      - POSTGRES_USER=${_DB_USER}
      - -e
      - POSTGRES_HOST=/cloudsql/$PROJECT_ID:${_REGION}:${_INSTANCE}
      - -e
      - DJANGO_ALLOWED_HOSTS=.run.app
      # These steps do not send mail, and production refuses to start with the
      # SMTP backend and no host. Declaring the dummy backend is exactly what
      # config/env.py suggests, and beats inventing a mail host here.
      - -e
      - DJANGO_EMAIL_BACKEND=django.core.mail.backends.dummy.EmailBackend
      - --
      # uv run, not bare python: the image installs dependencies into the uv
      # virtualenv at /app/.venv, which a bare interpreter does not see. The
      # Dockerfile's own CMD runs gunicorn the same way.
      - uv
      - run
      - python
      - manage.py
      - migrate
      - --noinput

  # Seeding runs after migrate and before deploy, so the service only ever
  # goes live against a database that already has its roles and chart of
  # accounts. Both commands are idempotent: seed_roles reconciles the three
  # groups and their permissions, and seed_kut_data will not overwrite a
  # balance or a rename a treasurer has made. That is what makes them safe
  # to run on every deploy rather than once by hand.
  - id: seed-roles
    name: gcr.io/google-appengine/exec-wrapper
    secretEnv: ['DJANGO_SECRET_KEY', 'POSTGRES_PASSWORD']
    args:
      - -i
      - us.gcr.io/$PROJECT_ID/kut-finans:$COMMIT_SHA
      - -s
      - $PROJECT_ID:${_REGION}:${_INSTANCE}
      - -e
      - DJANGO_ENV=production
      - -e
      - DJANGO_SECRET_KEY
      - -e
      - POSTGRES_PASSWORD
      - -e
      - POSTGRES_DB=${_DB_NAME}
      - -e
      - POSTGRES_USER=${_DB_USER}
      - -e
      - POSTGRES_HOST=/cloudsql/$PROJECT_ID:${_REGION}:${_INSTANCE}
      - -e
      - DJANGO_ALLOWED_HOSTS=.run.app
      # These steps do not send mail, and production refuses to start with the
      # SMTP backend and no host. Declaring the dummy backend is exactly what
      # config/env.py suggests, and beats inventing a mail host here.
      - -e
      - DJANGO_EMAIL_BACKEND=django.core.mail.backends.dummy.EmailBackend
      - --
      # uv run, not bare python: the image installs dependencies into the uv
      # virtualenv at /app/.venv, which a bare interpreter does not see. The
      # Dockerfile's own CMD runs gunicorn the same way.
      - uv
      - run
      - python
      - manage.py
      - seed_roles

  - id: seed-kut-data
    name: gcr.io/google-appengine/exec-wrapper
    secretEnv: ['DJANGO_SECRET_KEY', 'POSTGRES_PASSWORD']
    args:
      - -i
      - us.gcr.io/$PROJECT_ID/kut-finans:$COMMIT_SHA
      - -s
      - $PROJECT_ID:${_REGION}:${_INSTANCE}
      - -e
      - DJANGO_ENV=production
      - -e
      - DJANGO_SECRET_KEY
      - -e
      - POSTGRES_PASSWORD
      - -e
      - POSTGRES_DB=${_DB_NAME}
      - -e
      - POSTGRES_USER=${_DB_USER}
      - -e
      - POSTGRES_HOST=/cloudsql/$PROJECT_ID:${_REGION}:${_INSTANCE}
      - -e
      - DJANGO_ALLOWED_HOSTS=.run.app
      # These steps do not send mail, and production refuses to start with the
      # SMTP backend and no host. Declaring the dummy backend is exactly what
      # config/env.py suggests, and beats inventing a mail host here.
      - -e
      - DJANGO_EMAIL_BACKEND=django.core.mail.backends.dummy.EmailBackend
      - --
      # uv run, not bare python: the image installs dependencies into the uv
      # virtualenv at /app/.venv, which a bare interpreter does not see. The
      # Dockerfile's own CMD runs gunicorn the same way.
      - uv
      - run
      - python
      - manage.py
      - seed_kut_data

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=us.gcr.io/$PROJECT_ID/kut-finans:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_INSTANCE}
      - --set-secrets=DJANGO_SECRET_KEY=oniki-sepet-django-secret-key:latest,POSTGRES_PASSWORD=oniki-sepet-postgres-password:latest
      - --set-env-vars=^@^DJANGO_ENV=production@DJANGO_ALLOWED_HOSTS=.run.app@DJANGO_CSRF_TRUSTED_ORIGINS=https://*.run.app@POSTGRES_DB=${_DB_NAME}@POSTGRES_USER=${_DB_USER}@POSTGRES_HOST=/cloudsql/$PROJECT_ID:${_REGION}:${_INSTANCE}@GS_BUCKET_NAME=${_BUCKET}@DJANGO_SECURE_SSL_REDIRECT=true@DJANGO_EMAIL_BACKEND=${_EMAIL_BACKEND}@DJANGO_DEFAULT_FROM_EMAIL=${_FROM_EMAIL}
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --timeout=300
      - --port=8000

images:
  - us.gcr.io/$PROJECT_ID/kut-finans:$COMMIT_SHA
  - us.gcr.io/$PROJECT_ID/kut-finans:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
