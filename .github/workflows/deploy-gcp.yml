name: Deploy to GCP

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Container image tag (default: git SHA)"
        required: false
        type: string

env:
  GCP_REGION: europe-west1
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  ARTIFACT_REGISTRY: ${{ secrets.GCP_ARTIFACT_REGISTRY }}
  CLOUD_RUN_SERVICE: kut-finans
  GCS_MEDIA_BUCKET_NAME: ${{ secrets.GCS_MEDIA_BUCKET_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          IMAGE="${ARTIFACT_REGISTRY}/${CLOUD_RUN_SERVICE}:${IMAGE_TAG}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image "${IMAGE}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "DJANGO_SETTINGS_MODULE=config.production_settings" \
            --set-secrets "DJANGO_SECRET_KEY=DJANGO_SECRET_KEY:latest,DATABASE_URL=DATABASE_URL:latest" \
            --set-env-vars "DJANGO_ALLOWED_HOSTS=${{ secrets.DJANGO_ALLOWED_HOSTS }}" \
            --set-env-vars "DJANGO_FILE_STORAGE_BACKEND=gcs" \
            --set-env-vars "GCS_MEDIA_BUCKET_NAME=${GCS_MEDIA_BUCKET_NAME}" \
            --add-cloudsql-instances "${{ secrets.CLOUD_SQL_INSTANCE }}" \
            --port 8000

      - name: Verify health check
        run: |
          SERVICE_URL="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region "${GCP_REGION}" \
            --format 'value(status.url)')"
          curl --fail --retry 5 --retry-delay 5 "${SERVICE_URL}/health/"
