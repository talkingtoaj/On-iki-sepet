{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Şifre sıfırlama | KUT Finans</title>
    <link rel="stylesheet" href="{% static 'onikisepet/app.css' %}">
</head>
<body class="login-page">
    <section class="login-panel">
        <h1>Şifre sıfırlama</h1>
        <p class="login-subtitle">
            Kayıtlı e-posta adresinizi girin; size şifre sıfırlama bağlantısı gönderelim.
        </p>

        <form class="form" method="post">
            {% csrf_token %}
            {% if form.email.errors %}
                <ul class="form-error">
                    {% for error in form.email.errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
            <div class="form-field">
                <label class="form-label" for="id_email">E-posta</label>
                <input
                    class="form-control"
                    id="id_email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required
                    {% if form.email.value %}value="{{ form.email.value }}"{% endif %}
                >
            </div>
            <div class="form-actions">
                <button class="btn btn--primary" type="submit">Bağlantı gönder</button>
            </div>
        </form>
        <p class="login-links">
            <a href="{% url 'login' %}">Giriş sayfasına dön</a>
        </p>
    </section>
</body>
</html>
