{% extends "base.html" %}
{% block title %}Add Exchange Rate{% endblock %}
{% block content %}
<h1>Add Exchange Rate</h1>

<p>Enter how many {{ base_currency }} one unit of the foreign currency is worth.</p>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save</button>
</form>
{% endblock %}
