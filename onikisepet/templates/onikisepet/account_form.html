{% extends "onikisepet/base.html" %}

{% block title %}Hesap Oluştur | KUT Finans{% endblock %}

{% block content %}
    <section class="content-panel">
        <header class="page-header">
            <p class="eyebrow">Yönetim</p>
            <h1>Hesap Oluştur</h1>
        </header>

        <form class="form" method="post">
            {% csrf_token %}
            {% include "onikisepet/includes/form_fields.html" %}
            <div class="form-actions">
                <button class="btn btn--primary" type="submit">Kaydet</button>
                <a class="btn btn--secondary" href="{% url 'account_list' %}">İptal</a>
            </div>
        </form>
    </section>
{% endblock %}
