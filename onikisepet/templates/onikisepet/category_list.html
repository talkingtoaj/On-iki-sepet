{% extends "onikisepet/base.html" %}

{% block title %}Kategoriler | On İki Sepet{% endblock %}

{% block content %}
    <section class="content-panel">
        <h1>Kategoriler</h1>

        {% if categories %}
            <ul>
                {% for category in categories %}
                    <li>{{ category.name }}</li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No categories found.</p>
        {% endif %}
    </section>
{% endblock %}
